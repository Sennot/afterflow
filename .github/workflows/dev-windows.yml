name: Dev Windows

on:
  workflow_dispatch:
  push:
    branches:
      - deep-scan

permissions:
  contents: read

jobs:
  build:
    name: Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          cli: latest

      - uses: actions/upload-artifact@v4
        with:
          name: afterflow-windows
          path: ${{ steps.build.outputs.build-output }}
